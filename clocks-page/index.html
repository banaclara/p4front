<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="clocks container">
      <div class="clock">
        <div id="clock-br" class="time"></div>
        <div class="timezone">BR - São Paulo</div>
      </div>
      <div class="clock">
        <div id="clock-uk" class="time"></div>
        <div class="timezone">UK - Londres</div>
      </div>
      <div class="clock">
        <div id="clock-jp" class="time"></div>
        <div class="timezone">JP - Tóquio</div>
      </div>
    </div>
    <script src="assets/script.js"></script>
  </body>
</html>
